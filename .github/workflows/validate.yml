name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xian-configs
        uses: actions/checkout@v6
        with:
          path: xian-configs

      - name: Checkout xian-cli
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/xian-cli
          ref: main
          path: xian-cli

      - name: Checkout xian-abci
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/xian-abci
          ref: main
          path: xian-abci

      - name: Checkout xian-contracting
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/xian-contracting
          ref: main
          path: xian-contracting

      - name: Use matching xian-contracting branch when available
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ github.head_ref || github.ref_name }}"
          REMOTE="https://github.com/${{ github.repository_owner }}/xian-contracting"
          if git ls-remote --exit-code --heads "$REMOTE" "$BRANCH" >/dev/null 2>&1; then
            git -C xian-contracting fetch --depth=1 origin "$BRANCH"
            git -C xian-contracting checkout -B "$BRANCH" FETCH_HEAD
          fi

      - name: Checkout xian-linter
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/xian-linter
          ref: main
          path: xian-linter

      - name: Checkout xian-py
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/xian-py
          ref: main
          path: xian-py

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Validate manifests and solution-pack contracts
        working-directory: xian-configs
        run: |
          uv run --project ../xian-contracting python \
            ../xian-contracting/scripts/audit_python_vm_compatibility.py \
            ./contracts \
            ./solution-packs \
            --fail-on-issues
          uv run --project ../xian-contracting python \
            ../xian-contracting/scripts/audit_authored_conformance.py \
            ./contracts \
            ./solution-packs \
            --fail-on-issues
          uv run --project ../xian-cli python ./scripts/validate-manifests.py
          uv run --project ../xian-linter python ./scripts/validate-solution-pack-contracts.py
