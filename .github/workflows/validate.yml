name: Validate

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xian-configs
        uses: actions/checkout@v7
        with:
          path: xian-configs

      - name: Checkout xian-cli
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-cli
          ref: main
          path: xian-cli

      - name: Checkout xian-abci
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-abci
          ref: main
          path: xian-abci

      - name: Checkout xian-contracting
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-contracting
          ref: main
          path: xian-contracting

      - name: Checkout xian-py
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/xian-py
          ref: main
          path: xian-py

      - name: Use matching component branches when available
        env:
          MATCHING_BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          for repo in xian-cli xian-abci xian-contracting xian-py; do
            remote="https://github.com/$REPO_OWNER/$repo"
            ref="refs/heads/$MATCHING_BRANCH"
            if git ls-remote --exit-code --heads "$remote" "$ref" >/dev/null; then
              git -C "$repo" fetch --depth=1 origin "$ref"
              git -C "$repo" checkout --detach FETCH_HEAD
            fi
          done

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Validate manifests and system contracts
        working-directory: xian-configs
        run: |
          uv run --project ../xian-contracting python \
            ../xian-contracting/scripts/audit_authored_conformance.py \
            ./contracts \
            --fail-on-issues
          uv run --project ../xian-cli python ./scripts/validate-manifests.py
          uv run --project ../xian-cli --group dev python -m pytest -q tests
